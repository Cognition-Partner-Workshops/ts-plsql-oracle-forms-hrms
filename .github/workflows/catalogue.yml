name: Catalogue

on: [pull_request, push]

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 -m unittest discover -s harness -p 'test_catalogue.py' -v
